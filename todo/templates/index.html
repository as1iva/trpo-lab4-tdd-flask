<h1>Мои задачи</h1>
<form method="post" action="/tasks"><label>Название <input name="title"></label><button>Добавить</button></form>
{% for task in tasks %}<article data-id="{{ task.id }}" data-done="{{ task.done|int }}"><span>{{ task.title }}</span><form method="post" action="/tasks/{{ task.id }}/toggle"><button>{{ "Вернуть" if task.done else "Выполнить" }}</button></form></article>
{% else %}<p>Задач пока нет</p>{% endfor %}
