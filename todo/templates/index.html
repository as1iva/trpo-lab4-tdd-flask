<h1>Мои задачи</h1>
<nav><a href="/?status=all">Все</a> <a href="/?status=active">Активные</a> <a href="/?status=completed">Выполненные</a></nav>
<form method="get"><label>Поиск <input name="q" value="{{ query }}"></label><button>Найти</button></form>
<form method="post" action="/tasks"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Название <input name="title"></label><button>Добавить</button></form>
{% for task in tasks %}<article data-id="{{ task.id }}" data-done="{{ task.done|int }}"><span>{{ task.title }}</span><a href="/tasks/{{ task.id }}/edit">Изменить</a><form method="post" action="/tasks/{{ task.id }}/toggle"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>{{ "Вернуть" if task.done else "Выполнить" }}</button></form><form method="post" action="/tasks/{{ task.id }}/delete"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Удалить</button></form></article>
{% else %}<p>Задач пока нет</p>{% endfor %}
